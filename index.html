<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Notelets" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Notelets</title>
    <script>
      // Apply the stored dark-mode preference before first paint and keep the
      // theme-color meta (which colours the status bar of the installed iOS
      // app) in sync with the app's class-based dark mode.
      (function () {
        var root = document.documentElement
        var meta = document.querySelector('meta[name="theme-color"]')
        function sync() {
          meta.setAttribute('content', root.classList.contains('dark') ? '#111827' : '#ffffff')
        }
        try {
          if (localStorage.getItem('darkMode') === 'true') root.classList.add('dark')
        } catch (e) {}
        sync()
        new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ['class'] })
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
